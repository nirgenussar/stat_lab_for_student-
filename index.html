<script>
(function () {
  var CUTOFF = Date.parse(window.ACCESS_UNTIL);
  var $ = function (id) { return document.getElementById(id); };

  function nowMs() {
    return new Promise(function (resolve) {
      var done = false, t = setTimeout(function () { if (!done) { done = true; resolve(Date.now()); } }, 4000);
      fetch("https://worldtimeapi.org/api/timezone/Asia/Jerusalem")
        .then(function (r) { return r.json(); })
        .then(function (j) { if (!done) { done = true; clearTimeout(t); resolve(j && j.unixtime ? j.unixtime * 1000 : Date.now()); } })
        .catch(function () { if (!done) { done = true; clearTimeout(t); resolve(Date.now()); } });
    });
  }

  function openLab() {
    var b64 = $("lab-b64").textContent.trim();
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: "text/html;charset=utf-8" });
    var frame = $("labframe");
    frame.src = URL.createObjectURL(blob);
    frame.style.display = "block";
    $("load").style.display = "none";
  }

  nowMs().then(function (ms) {
    if (ms >= CUTOFF) { $("load").style.display = "none"; $("expired").style.display = "flex"; }
    else { openLab(); }
  });
})();
</script>
